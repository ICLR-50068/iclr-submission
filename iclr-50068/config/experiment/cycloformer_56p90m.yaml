# @package _global_
defaults:
  - /pose_module: pose
  - /network: cycloformer_56p90m
  - _self_

# 56.90M. Effective batch 256 (16 x 8 x 2 GPUs).
# 5-epoch LR warmup from 1% peak, 15-epoch augmentation ramp.

data_location: ~/emg2pose_data
provide_initial_pos: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  weight_decay: 1.0e-4

loss_weights:
  mae: 1
  fingertip_distance: 0.01
  landmark_distance: 0.0

datamodule:
  window_length: 10000
  val_test_window_length: 10000
  padding: [0, 0]
  skip_ik_failures: true
  stride: null
  num_train_sessions: null
  random_sampled_windows: false
  windows_per_session: 10

batch_size: 16
matmul_precision: high

trainer:
  gradient_clip_val: 1.0
  max_epochs: 100
  accumulate_grad_batches: 8
  devices: 2
  strategy: ddp

lr_scheduler:
  scheduler:
    _target_: emg2pose.schedules.WarmupCosineLR
    T_max: 100
    warmup_epochs: 5
    warmup_start_factor: 0.01
    eta_min: 5.0e-6
  interval: epoch
  monitor: ${monitor_metric}

monitor_metric: val_mae
monitor_mode: min

callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: emg2pose.schedules.AugmentationRamp
    ramp_epochs: 15
    start_factor: 0.0
    targets:
      channel_drop_p: 0.2
      amplitude_jitter_std: 0.08
      chunk_mask_ratio: 0.05
      channel_mix_strength: 0.1
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: ${monitor_metric}
    mode: ${monitor_mode}
    save_last: true
    save_top_k: 1
    verbose: true
